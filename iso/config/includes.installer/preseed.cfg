# Preseed per l'installer (voce "Install" nel menu della ISO).
# Lingua, tastiera e fuso sono automatici; il PARTIZIONAMENTO resta manuale
# di proposito, così non cancelli per sbaglio un disco (eMMC vs chiavetta).
d-i debian-installer/locale string it_IT.UTF-8
d-i keyboard-configuration/xkb-keymap select it
d-i time/zone string Europe/Rome
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

# L'utente "comodino" è già nell'immagine: nessun nuovo utente,
# solo una password di root per la manutenzione.
d-i passwd/make-user boolean false
d-i passwd/root-login boolean true

# Rete: verrà gestita da NetworkManager nel sistema installato
d-i netcfg/enable boolean false
d-i apt-setup/use_mirror boolean false

# GRUB anche in \EFI\BOOT\BOOTX64.EFI: è il file che il firmware Chuwi avvia con
# la voce "Android". Senza fbx64.efi accanto, così shim avvia GRUB invece di
# ricreare le voci e riavviare (bootloop).
d-i grub-installer/only_debian boolean true
d-i grub-installer/force-efi-extra-removable boolean true
d-i preseed/late_command string in-target sh -c 'rm -f /boot/efi/EFI/BOOT/fbx64.efi; cp /boot/efi/EFI/debian/grub.cfg /boot/efi/EFI/BOOT/grub.cfg; sed -i "s/^GRUB_TIMEOUT=.*/GRUB_TIMEOUT=1/" /etc/default/grub; update-grub' || true
d-i finish-install/reboot_in_progress note
